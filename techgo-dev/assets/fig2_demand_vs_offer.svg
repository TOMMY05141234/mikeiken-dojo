<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480" role="img" aria-labelledby="f2t f2d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<title id="f2t">「求人が多い言語」と「提示年収が高い言語」は一致しない</title>
<desc id="f2d">paizaの調査による企業ニーズ（求人に占める割合）はJavaScript14.4%、Java13.9%、PHP11.0%。平均提示年収はGo723万円、TypeScript714万円、Ruby689万円。上位に並ぶ言語の顔ぶれが異なることを示す図。</desc>

<rect width="360" height="480" fill="#0B1220"/>

<text x="16" y="28" fill="#EAF0FF" font-size="15" font-weight="700">「求人が多い言語」と</text>
<text x="16" y="48" fill="#EAF0FF" font-size="15" font-weight="700">「提示年収が高い言語」は一致しない</text>

<!-- ===== upper : 企業ニーズ ===== -->
<text x="16" y="78" fill="#A7B0C0" font-size="12" font-weight="700">企業ニーズ（求人に占める割合）</text>
<g stroke="#1B2438" stroke-width="1">
<line x1="95" y1="88" x2="95" y2="200"/>
<line x1="146.25" y1="88" x2="146.25" y2="200"/>
<line x1="197.5" y1="88" x2="197.5" y2="200"/>
<line x1="248.75" y1="88" x2="248.75" y2="200"/>
<line x1="300" y1="88" x2="300" y2="200"/>
</g>

<text x="16" y="107" fill="#C9D3E6" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">JavaScript</text>
<rect x="95" y="94" width="184.5" height="18" rx="4" fill="#7F8AA3"/>
<text x="284.5" y="107" fill="#A7B0C0" font-size="12" font-weight="700">14.4%</text>

<text x="16" y="141" fill="#F5C451" font-size="12" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Java</text>
<rect x="95" y="128" width="178.1" height="18" rx="4" fill="#F5C451"/>
<text x="278" y="141" fill="#F5C451" font-size="12" font-weight="700">13.9%</text>
<text x="95" y="161" fill="#F5C451" font-size="12" opacity=".92">求人の選択肢は多い</text>

<text x="16" y="185" fill="#C9D3E6" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">PHP</text>
<rect x="95" y="172" width="140.9" height="18" rx="4" fill="#7F8AA3"/>
<text x="241" y="185" fill="#A7B0C0" font-size="12" font-weight="700">11.0%</text>

<line x1="95" y1="200" x2="300" y2="200" stroke="#344055" stroke-width="1.5"/>
<g fill="#7F8AA3" font-size="12" text-anchor="middle">
<text x="95" y="214">0%</text><text x="146.25" y="214">4%</text><text x="197.5" y="214">8%</text><text x="248.75" y="214">12%</text><text x="300" y="214">16%</text>
</g>

<!-- ===== middle band ===== -->
<rect x="16" y="228" width="328" height="78" rx="12" fill="#131C2E" stroke="#212C42" stroke-width="1"/>
<text x="32" y="252" fill="#5EEAD4" font-size="12" font-weight="700">上位に並ぶ顔ぶれが違う ＝</text>
<text x="32" y="272" fill="#C9D3E6" font-size="12">条件を決めているのは「言語名」ではなく</text>
<text x="32" y="292" fill="#C9D3E6" font-size="12">「使われている事業領域」</text>

<!-- ===== lower : 平均提示年収 ===== -->
<text x="16" y="332" fill="#A7B0C0" font-size="12" font-weight="700">平均提示年収</text>
<text x="344" y="332" text-anchor="end" fill="#7F8AA3" font-size="12">単位：万円</text>
<g stroke="#1B2438" stroke-width="1">
<line x1="95" y1="340" x2="95" y2="452"/>
<line x1="146.25" y1="340" x2="146.25" y2="452"/>
<line x1="197.5" y1="340" x2="197.5" y2="452"/>
<line x1="248.75" y1="340" x2="248.75" y2="452"/>
<line x1="300" y1="340" x2="300" y2="452"/>
</g>

<text x="16" y="359" fill="#C9D3E6" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Go</text>
<rect x="95" y="346" width="185.3" height="18" rx="4" fill="#7F8AA3"/>
<text x="285" y="359" fill="#A7B0C0" font-size="12" font-weight="700">723</text>

<text x="16" y="393" fill="#C9D3E6" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">TypeScript</text>
<rect x="95" y="380" width="183" height="18" rx="4" fill="#7F8AA3"/>
<text x="283" y="393" fill="#A7B0C0" font-size="12" font-weight="700">714</text>

<text x="16" y="427" fill="#C9D3E6" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">Ruby</text>
<rect x="95" y="414" width="176.5" height="18" rx="4" fill="#7F8AA3"/>
<text x="276.5" y="427" fill="#A7B0C0" font-size="12" font-weight="700">689</text>

<line x1="95" y1="452" x2="300" y2="452" stroke="#344055" stroke-width="1.5"/>
<g fill="#7F8AA3" font-size="12" text-anchor="middle">
<text x="95" y="466">0</text><text x="146.25" y="466">200</text><text x="197.5" y="466">400</text><text x="248.75" y="466">600</text><text x="300" y="466">800</text>
</g>
</svg>
