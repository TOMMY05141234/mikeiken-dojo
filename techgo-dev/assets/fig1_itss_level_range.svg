<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 464" role="img" aria-labelledby="f1t f1d" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<title id="f1t">同じ「レベル3」でも、年収レンジはこれだけ違う</title>
<desc id="f1d">厚生労働省job tagのITSSレベル別年収レンジ。レベル3では設計・構築450〜700万円、ソフトウェア開発スペシャリスト450〜695万円、データサイエンティスト600〜900万円。レベル5以上では設計・構築600〜950万円、ソフトウェア開発スペシャリスト550〜866万円、データサイエンティスト700〜1,100万円。</desc>

<rect width="360" height="464" fill="#0B1220"/>

<!-- title -->
<text x="16" y="28" fill="#EAF0FF" font-size="15" font-weight="700">同じ「レベル3」でも、</text>
<text x="16" y="48" fill="#EAF0FF" font-size="15" font-weight="700">年収レンジはこれだけ違う</text>

<!-- gridlines -->
<g stroke="#1B2438" stroke-width="1">
<line x1="40" y1="82" x2="40" y2="414"/>
<line x1="77.1" y1="82" x2="77.1" y2="414"/>
<line x1="114.3" y1="82" x2="114.3" y2="414"/>
<line x1="151.4" y1="82" x2="151.4" y2="414"/>
<line x1="188.6" y1="82" x2="188.6" y2="414"/>
<line x1="225.7" y1="82" x2="225.7" y2="414"/>
<line x1="262.9" y1="82" x2="262.9" y2="414"/>
<line x1="300" y1="82" x2="300" y2="414"/>
</g>

<!-- group : level 3 -->
<line x1="76" y1="68" x2="344" y2="68" stroke="#212C42" stroke-width="1"/>
<text x="16" y="72" fill="#F5C451" font-size="12" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">レベル3</text>

<!-- guide from bar1 end down to arrow (drawn under bars) -->
<line x1="151.4" y1="104" x2="151.4" y2="218" stroke="#F5C451" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>

<!-- row 1 -->
<text x="16" y="98" fill="#C9D3E6" font-size="12">設計・構築／レベル3</text>
<rect x="58.6" y="104" width="92.9" height="18" rx="4" fill="#7F8AA3"/>
<text x="64.6" y="117" fill="#0B1220" font-size="12" font-weight="700">450</text>
<text x="156.4" y="117" fill="#A7B0C0" font-size="12" font-weight="700">700</text>

<!-- row 2 -->
<text x="16" y="140" fill="#C9D3E6" font-size="12">ソフトウェア開発スペシャリスト／レベル3</text>
<rect x="58.6" y="146" width="91" height="18" rx="4" fill="#7F8AA3"/>
<text x="64.6" y="159" fill="#0B1220" font-size="12" font-weight="700">450</text>
<text x="154.6" y="159" fill="#A7B0C0" font-size="12" font-weight="700">695</text>

<!-- row 3 -->
<text x="16" y="182" fill="#5EEAD4" font-size="12" font-weight="700">データサイエンティスト／レベル3</text>
<rect x="114.3" y="188" width="111.4" height="18" rx="4" fill="#2DD4BF"/>
<text x="120.3" y="201" fill="#052019" font-size="12" font-weight="700">600</text>
<text x="231.7" y="201" fill="#5EEAD4" font-size="12" font-weight="700">900</text>

<!-- annotation arrow -->
<line x1="225.7" y1="206" x2="225.7" y2="218" stroke="#F5C451" stroke-width="1" stroke-dasharray="3 3" opacity=".55"/>
<line x1="155" y1="218" x2="222" y2="218" stroke="#F5C451" stroke-width="1.4"/>
<polygon points="151.4,218 158,214.6 158,221.4" fill="#F5C451"/>
<polygon points="225.7,218 219.1,214.6 219.1,221.4" fill="#F5C451"/>
<text x="344" y="238" text-anchor="end" fill="#F5C451" font-size="12" font-weight="700">同じレベル3でも上限に200万円の開き</text>

<!-- group : level 5+ -->
<line x1="96" y1="266" x2="344" y2="266" stroke="#212C42" stroke-width="1"/>
<text x="16" y="270" fill="#F5C451" font-size="12" font-weight="700" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">レベル5以上</text>

<!-- row 4 -->
<text x="16" y="296" fill="#C9D3E6" font-size="12">設計・構築／レベル5以上</text>
<rect x="114.3" y="302" width="130" height="18" rx="4" fill="#9AA5BB"/>
<text x="120.3" y="315" fill="#0B1220" font-size="12" font-weight="700">600</text>
<text x="250.3" y="315" fill="#A7B0C0" font-size="12" font-weight="700">950</text>

<!-- row 5 -->
<text x="16" y="338" fill="#C9D3E6" font-size="12">ソフトウェア開発スペシャリスト／レベル5以上</text>
<rect x="95.7" y="344" width="117.4" height="18" rx="4" fill="#9AA5BB"/>
<text x="101.7" y="357" fill="#0B1220" font-size="12" font-weight="700">550</text>
<text x="219.1" y="357" fill="#A7B0C0" font-size="12" font-weight="700">866</text>

<!-- row 6 -->
<text x="16" y="380" fill="#5EEAD4" font-size="12" font-weight="700">データサイエンティスト／レベル5以上</text>
<rect x="151.4" y="386" width="148.6" height="18" rx="4" fill="#5EEAD4"/>
<text x="157.4" y="399" fill="#052019" font-size="12" font-weight="700">700</text>
<text x="306" y="399" fill="#5EEAD4" font-size="12" font-weight="700">1,100</text>

<!-- axis -->
<line x1="40" y1="414" x2="300" y2="414" stroke="#344055" stroke-width="1.5"/>
<g fill="#7F8AA3" font-size="12" text-anchor="middle">
<text x="40" y="430">400</text>
<text x="77.1" y="430">500</text>
<text x="114.3" y="430">600</text>
<text x="151.4" y="430">700</text>
<text x="188.6" y="430">800</text>
<text x="225.7" y="430">900</text>
<text x="262.9" y="430">1000</text>
<text x="300" y="430">1100</text>
</g>
<text x="344" y="450" text-anchor="end" fill="#7F8AA3" font-size="12">単位：万円</text>
</svg>
