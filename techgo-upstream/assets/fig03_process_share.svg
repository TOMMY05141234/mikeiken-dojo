<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-labelledby="f3t f3d" preserveAspectRatio="xMidYMid meet">
<title id="f3t">下請けが担当することの多い工程の内訳</title>
<desc id="f3d">下請として担当することの多い工程の横棒グラフ。開発（プログラミング）工程56.6パーセント、設計工程20.6パーセント、運用工程5.9パーセント、ユーザーへの提案・要件定義5.5パーセント、システムインテグレーション工程5.4パーセント、テスト工程1.3パーセント、その他4.6パーセント。上流にあたる提案・要件定義は5.5パーセントにとどまる。</desc>
<style>
  .ttl{font:700 17px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#EAF0FF}
  .sub{font:400 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#A7B0C0}
  .lb{font:500 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#C9D2E2}
  .lbh{font:700 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#2DD4BF}
  .vl{font:700 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#C9D2E2}
  .vlh{font:700 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#2DD4BF}
  .ax{font:400 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#8D97AB}
  .cal{font:700 13.5px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#2DD4BF}
</style>
<rect width="600" height="400" fill="#0B1220"/>

<text class="ttl" x="20" y="32">下請として担当することの多い工程</text>
<text class="sub" x="20" y="56">ソフトウェア業の下請事業者への調査（1つ選択・回答数2,589）</text>

<!-- highlight row background -->
<rect x="20" y="214" width="560" height="34" rx="8" fill="#0F2A2B" stroke="#2DD4BF" stroke-opacity=".45"/>

<!-- gridlines -->
<g stroke="#28324A" stroke-width="1" stroke-dasharray="3 4">
  <line x1="336" y1="92" x2="336" y2="368"/>
  <line x1="432" y1="92" x2="432" y2="368"/>
  <line x1="528" y1="92" x2="528" y2="368"/>
</g>
<line x1="240" y1="92" x2="240" y2="368" stroke="#48566F" stroke-width="1.4"/>

<!-- bars -->
<g>
  <text class="lb" x="230" y="116" text-anchor="end">開発（プログラミング）</text>
  <rect x="240" y="100" width="272" height="22" rx="4" fill="#9AA0A6"/>
  <text class="vl" x="520" y="116">56.6%</text>

  <text class="lb" x="230" y="156" text-anchor="end">設計（外部・内部設計）</text>
  <rect x="240" y="140" width="99" height="22" rx="4" fill="#9AA0A6"/>
  <text class="vl" x="347" y="156">20.6%</text>

  <text class="lb" x="230" y="196" text-anchor="end">運用</text>
  <rect x="240" y="180" width="28" height="22" rx="4" fill="#9AA0A6"/>
  <text class="vl" x="276" y="196">5.9%</text>

  <text class="lbh" x="230" y="236" text-anchor="end">ユーザーへの提案・要件定義</text>
  <rect x="240" y="220" width="26" height="22" rx="4" fill="#2DD4BF"/>
  <text class="vlh" x="274" y="236">5.5%</text>
  <text class="cal" x="322" y="236">← 上流にあたるのは、ここだけ</text>

  <text class="lb" x="230" y="276" text-anchor="end">システムインテグレーション</text>
  <rect x="240" y="260" width="26" height="22" rx="4" fill="#9AA0A6"/>
  <text class="vl" x="274" y="276">5.4%</text>

  <text class="lb" x="230" y="316" text-anchor="end">テスト</text>
  <rect x="240" y="300" width="6" height="22" rx="3" fill="#9AA0A6"/>
  <text class="vl" x="254" y="316">1.3%</text>

  <text class="lb" x="230" y="356" text-anchor="end">その他</text>
  <rect x="240" y="340" width="22" height="22" rx="4" fill="#5A6376"/>
  <text class="vl" x="270" y="356">4.6%</text>
</g>

<!-- x axis -->
<line x1="240" y1="368" x2="570" y2="368" stroke="#48566F" stroke-width="1.4"/>
<g class="ax" text-anchor="middle">
  <text x="240" y="386">0</text>
  <text x="336" y="386">20</text>
  <text x="432" y="386">40</text>
  <text x="528" y="386">60%</text>
</g>
</svg>
