<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" role="img" aria-labelledby="f1t f1d" preserveAspectRatio="xMidYMid meet">
<title id="f1t">同一ITスキルレベル内の職種別 年収中央値</title>
<desc id="f1d">ITスキルレベル3・4・5以上のそれぞれで、運用・保守／設計・構築／企画立案・プロジェクト管理の年収中央値を比較したグループ縦棒グラフ。レベル3では設計・構築550万円に対し企画立案・プロジェクト管理は750万円で、差は200万円。</desc>
<style>
  .ttl{font:700 17px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#EAF0FF}
  .sub{font:400 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#A7B0C0}
  .lg{font:500 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#C9D2E2}
  .ax{font:400 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#8D97AB}
  .xl{font:700 13.5px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#EAF0FF}
  .vl{font:700 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#C9D2E2}
  .vlu{font:700 13px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#9FC0FF}
  .cal{font:700 13.5px 'Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',sans-serif;fill:#2DD4BF}
</style>
<rect width="600" height="380" fill="#0B1220"/>

<text class="ttl" x="20" y="34">同じスキルレベルでも、担当工程で相場が違う</text>
<text class="sub" x="20" y="58">正社員の年収中央値（万円）／ITスキルレベル別・職種別</text>

<!-- legend -->
<g>
  <rect x="20" y="78" width="12" height="12" rx="3" fill="#9AA0A6"/>
  <text class="lg" x="38" y="88">運用・保守</text>
  <rect x="118" y="78" width="12" height="12" rx="3" fill="#6B7688"/>
  <text class="lg" x="136" y="88">設計・構築</text>
  <rect x="216" y="78" width="12" height="12" rx="3" fill="#5B8DEF"/>
  <text class="lg" x="234" y="88">企画立案・プロジェクト管理</text>
</g>

<!-- gridlines -->
<g stroke="#28324A" stroke-width="1">
  <line x1="82" y1="133" x2="570" y2="133" stroke-dasharray="3 4"/>
  <line x1="82" y1="202" x2="570" y2="202" stroke-dasharray="3 4"/>
  <line x1="82" y1="271" x2="570" y2="271" stroke-dasharray="3 4"/>
</g>
<line x1="82" y1="340" x2="570" y2="340" stroke="#48566F" stroke-width="1.5"/>
<g class="ax" text-anchor="end">
  <text x="74" y="137">900</text>
  <text x="74" y="206">600</text>
  <text x="74" y="275">300</text>
  <text x="74" y="344">0</text>
</g>

<!-- bars: level 3 -->
<g>
  <rect x="86"  y="213.5" width="32" height="126.5" rx="4" fill="#9AA0A6"/>
  <rect x="130" y="213.5" width="32" height="126.5" rx="4" fill="#6B7688"/>
  <rect x="174" y="167.5" width="32" height="172.5" rx="4" fill="#5B8DEF"/>
  <text class="vl"  x="102" y="206.5" text-anchor="middle">550</text>
  <text class="vl"  x="146" y="206.5" text-anchor="middle">550</text>
  <text class="vlu" x="190" y="160.5" text-anchor="middle">750</text>
</g>
<!-- bars: level 4 -->
<g>
  <rect x="260" y="190.5" width="32" height="149.5" rx="4" fill="#9AA0A6"/>
  <rect x="304" y="194"   width="32" height="146"   rx="4" fill="#6B7688"/>
  <rect x="348" y="156"   width="32" height="184"   rx="4" fill="#5B8DEF"/>
  <text class="vl"  x="276" y="183.5" text-anchor="middle">650</text>
  <text class="vl"  x="320" y="187"   text-anchor="middle">635</text>
  <text class="vlu" x="364" y="149"   text-anchor="middle">800</text>
</g>
<!-- bars: level 5+ -->
<g>
  <rect x="434" y="144.5" width="32" height="195.5" rx="4" fill="#9AA0A6"/>
  <rect x="478" y="179"   width="32" height="161"   rx="4" fill="#6B7688"/>
  <rect x="522" y="133"   width="32" height="207"   rx="4" fill="#5B8DEF"/>
  <text class="vl"  x="450" y="137.5" text-anchor="middle">850</text>
  <text class="vl"  x="494" y="172"   text-anchor="middle">700</text>
  <text class="vlu" x="538" y="126"   text-anchor="middle">900</text>
</g>

<!-- x labels -->
<g class="xl" text-anchor="middle">
  <text x="146" y="362">レベル3</text>
  <text x="320" y="362">レベル4</text>
  <text x="494" y="362">レベル5以上</text>
</g>

<!-- difference annotation -->
<g>
  <line x1="168" y1="146" x2="168" y2="163" stroke="#2DD4BF" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="168" y1="170" x2="168" y2="211" stroke="#2DD4BF" stroke-width="1.6"/>
  <polygon points="168,166 163.5,174 172.5,174" fill="#2DD4BF"/>
  <polygon points="168,215 163.5,207 172.5,207" fill="#2DD4BF"/>
  <rect x="58" y="112" width="212" height="32" rx="9" fill="#0F2A2B" stroke="#2DD4BF" stroke-opacity=".55"/>
  <text class="cal" x="164" y="133" text-anchor="middle">同じレベル3で 差 200万円</text>
</g>
</svg>
