<svg width="1000" height="380" viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">経験を評価に変える流れ</title>
<desc id="desc">経験の棚卸しから年収オファーまでの流れ</desc>
<rect width="1000" height="380" rx="28" fill="#0B1220"/>
<text x="56" y="65" fill="#FFFFFF" font-family="Arial" font-size="30" font-weight="700">経験は「伝わる形」にして初めて評価される</text>
<g font-family="Arial" font-size="16" font-weight="700" text-anchor="middle">
<g><rect x="45" y="145" width="130" height="78" rx="18" fill="#151E2F" stroke="#344055"/><text x="110" y="192" fill="#FFFFFF">実務経験</text></g>
<g><rect x="205" y="145" width="130" height="78" rx="18" fill="#151E2F" stroke="#344055"/><text x="270" y="180" fill="#FFFFFF">経験の</text><text x="270" y="204" fill="#FFFFFF">棚卸し</text></g>
<g><rect x="365" y="145" width="130" height="78" rx="18" fill="#151E2F" stroke="#344055"/><text x="430" y="180" fill="#FFFFFF">職務経歴書</text><text x="430" y="204" fill="#FFFFFF">に反映</text></g>
<g><rect x="525" y="145" width="130" height="78" rx="18" fill="#151E2F" stroke="#344055"/><text x="590" y="180" fill="#FFFFFF">面接で</text><text x="590" y="204" fill="#FFFFFF">伝える</text></g>
<g><rect x="685" y="145" width="130" height="78" rx="18" fill="#12261F" stroke="#2DD4BF"/><text x="750" y="180" fill="#FFFFFF">企業から</text><text x="750" y="204" fill="#FFFFFF">評価</text></g>
<g><rect x="845" y="145" width="130" height="78" rx="18" fill="#12261F" stroke="#2DD4BF"/><text x="910" y="180" fill="#FFFFFF">年収</text><text x="910" y="204" fill="#FFFFFF">オファー</text></g>
</g>
<g stroke="#2DD4BF" stroke-width="4" marker-end="url(#arrow)"><path d="M180 184 H198"/><path d="M340 184 H358"/><path d="M500 184 H518"/><path d="M660 184 H678"/><path d="M820 184 H838"/></g>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#2DD4BF"/></marker></defs>
<text x="56" y="305" fill="#A7B0C0" font-family="Arial" font-size="17">求人紹介だけではなく、経験を評価される形に整えるプロセスが重要。</text>
</svg>
